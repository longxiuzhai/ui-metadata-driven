server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/metadata_ui?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:gemii123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    token-ttl-seconds: ${JWT_TTL_SECONDS:28800}
    permit-all: false
    allow-header-overrides: false
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}

metadata:
  cards:
    behavior-trace:
      enabled: true

logging:
  level:
    com.example.metadataui: INFO
